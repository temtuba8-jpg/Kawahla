{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow p-4 border-top border-danger border-4">
            <h3 class="text-danger fw-bold text-center mb-3"><i class="fas fa-user-plus"></i> تسجيل مستخدم جديد (كاهلي / كاهلية)</h3>
            
            <!-- عرض رسائل الفلاش إن وجدت -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ 'danger' if category == 'danger' else 'success' }} alert-dismissible fade show" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form action="{{ url_for('register') }}" method="POST" enctype="multipart/form-data">
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">الاسم الكامل (ثلاثي أو رباعي):</label>
                        <input type="text" name="full_name" class="form-control" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">الرقم الوطني (اسم الدخول الأساسي):</label>
                        <input type="text" name="national_id" class="form-control" placeholder="أدخل الرقم الوطني" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">كلمة المرور:</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">رقم الجوال (الهاتف):</label>
                        <input type="tel" name="phone" class="form-control" placeholder="مثال: 249912345678+" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">اسم الدخول الاختياري (Username):</label>
                        <input type="text" name="username" class="form-control" placeholder="اختياري (إن وجد)">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">فرع القبيلة:</label>
                        <select name="branch" class="form-select" required>
                            <option value="الحسانية">الحسانية</option>
                            <option value="الحسونات">الحسونات</option>
                            <option value="العبابدة">العبابدة</option>
                            <option value="النفيدية">النفيدية</option>
                            <option value="البشاريون">البشاريون</option>
                            <option value="فرع عام آخر">فرع كواهلة آخر</option>
                        </select>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label fw-bold">تاريخ الميلاد:</label>
                        <input type="date" name="birth_date" class="form-control" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label fw-bold">العمر:</label>
                        <input type="number" name="age" class="form-control" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label fw-bold">عنوان السكن الحالي:</label>
                        <input type="text" name="residence" class="form-control">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">اسم الأب:</label>
                        <input type="text" name="father_name" class="form-control">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">اسم الجد:</label>
                        <input type="text" name="grandfather_name" class="form-control">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">الصورة الشخصية (اختر ملف أو التقط بالكاميرا المباشرة):</label>
                    <input type="file" name="profile_pic" class="form-control" accept="image/*" capture="user">
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">مستند يثبت الانتماء لقبيلة الكواهلة (شهادة بحث، بطاقة عائلية، أو وثيقة):</label>
                    <input type="file" name="document_pic" class="form-control" required>
                </div>

                <button type="submit" class="btn btn-danger w-100 py-2 fw-bold shadow">إرسال طلب التسجيل والتوثيق</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
