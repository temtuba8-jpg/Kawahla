{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow p-4 border-top border-danger border-4">
            <h3 class="text-danger fw-bold text-center mb-4"><i class="fas fa-sign-in-alt"></i> تسجيل الدخول للبوابة</h3>
            <form action="{{ url_for('login') }}" method="POST">
                <div class="mb-3">
                    <label class="form-label">اسم الدخول بالإنجليزية (Username):</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">كلمة المرور:</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-danger w-100 py-2 fw-bold">دخول إلى الحساب</button>
            </form>
            <div class="text-center mt-3">
                <small class="text-muted">ليس لديك حساب؟ <a href="{{ url_for('register') }}" class="text-danger fw-bold text-decoration-none">سجل الآن ككاهلي</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
